services:
  llm:
    image: python:3.12-slim
    working_dir: /app
    command: python -m uvicorn server:app --host 0.0.0.0 --port 8001
    volumes:
      - ./llm_mock:/app
      - ./requirements.txt:/app/requirements.txt
    # Installed on start so the image stays stock. Replace this service with vLLM on AMD.
    entrypoint: ["sh", "-c", "pip install -q fastapi uvicorn && python -m uvicorn server:app --host 0.0.0.0 --port 8001"]
  gateway:
    image: python:3.12-slim
    working_dir: /srv
    env_file: .env.example
    environment:
      LLM_BASE_URL: http://llm:8001/v1
      DATABASE_URL: sqlite:////srv/linelock.db
    volumes:
      - .:/srv
    command: ["sh", "-c", "pip install -q -r requirements.txt && cd gateway && python -m uvicorn main:app --host 0.0.0.0 --port 8080"]
    ports:
      - "8080:8080"
    depends_on:
      - llm
